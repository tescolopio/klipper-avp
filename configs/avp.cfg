[avp]
# Bed coordinates at the probe, not nozzle coordinates. Adjust for your printer.
mesh_min: 30, 30
mesh_max: 180, 180
min_probe_count: 3
max_probe_count: 9
warp_threshold: 0.05
horizontal_move_z: 10
clearance: 2
travel_speed: 100
approach_speed: 10
level_tolerance: 0.05
level_retries: 3
history_path: ~/printer_data/config/avp.sqlite3
history_limit: 100
# Disabled by default. Enable only after verifying a conservative upper bound
# on physical bed height in homed toolhead coordinates for ALL scan locations.
# max_surface_z: 1.0
